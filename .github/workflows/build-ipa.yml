name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme"
        required: true
        default: "3105"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Detect project
        run: |
          test -e "ThreeOneOSFive.xcodeproj"
          echo "Project: ThreeOneOSFive.xcodeproj"

      - name: List schemes
        run: |
          xcodebuild -list -project "ThreeOneOSFive.xcodeproj"

      - name: Check shared scheme
        run: |
          SCHEME_FILE="ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/${{ inputs.scheme }}.xcscheme"
          if [ ! -f "$SCHEME_FILE" ]; then
            echo "ERROR: Shared scheme not found: $SCHEME_FILE"
            exit 1
          fi
          echo "Shared scheme found: $SCHEME_FILE"

      - name: Archive unsigned app
        run: |
          xcodebuild archive \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "${{ inputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find built app
        run: |
          set -e
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d -print -quit)
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          APP_NAME=$(basename "$APP_PATH" .app)

          # Strip extended attributes and quarantine flags that cause codesign failures
          xattr -cr build/Payload || true

          # Ensure full directory and executable permissions (+x) on application binary
          chmod -R 755 build/Payload
          if [ -f "build/Payload/$APP_NAME.app/$APP_NAME" ]; then
            chmod +x "build/Payload/$APP_NAME.app/$APP_NAME"
          fi
          find "build/Payload/$APP_NAME.app" -type f -perm +111 -exec chmod 755 {} + 2>/dev/null || true

          # Package cleanly with zip preserving symlinks and excluding macOS metadata (__MACOSX / .DS_Store)
          cd build
          rm -f "unsigned-$APP_NAME.ipa"
          zip -qry "unsigned-$APP_NAME.ipa" Payload -x "*.DS_Store" -x "__MACOSX*"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Verify IPA
        run: |
          ls -lh "build/unsigned-$APP_NAME.ipa"
          unzip -l "build/unsigned-$APP_NAME.ipa" | head -30
          if unzip -l "build/unsigned-$APP_NAME.ipa" | grep -i "__MACOSX"; then
            echo "ERROR: __MACOSX resource forks detected in IPA!"
            exit 1
          fi
          echo "IPA packaging verified: Clean archive with correct binary permissions."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ env.APP_NAME }}
          path: build/unsigned-${{ env.APP_NAME }}.ipa
          retention-days: 7
